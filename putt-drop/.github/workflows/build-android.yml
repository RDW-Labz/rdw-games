# Builds the signed release AAB for Putt Drop (Capacitor android/).
name: build-android

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: versionCode (must be higher than every build already in Play; Play has 1)
        required: true
      version_name:
        description: versionName shown to testers (blank = package.json version)
        required: false
        default: ""
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "package*.json"
      - "capacitor.config.ts"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_code || '1' }}
      VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Resolve version_name from package.json (PR builds, or a dispatch without one)
        if: env.VERSION_NAME == ''
        run: echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Require Android signing secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          missing=
          [ -z "$ANDROID_KEYSTORE_B64" ] && missing="$missing ANDROID_KEYSTORE_B64"
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$ANDROID_KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          [ -z "$ANDROID_KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS (repo variable)"
          if [ -n "$missing" ]; then
            echo "Cannot build a signed release AAB: missing$missing."
            echo "Forks and repos without Play upload credentials must not produce unsigned release bundles."
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode upload key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"

      - name: Build release AAB
        working-directory: android
        env:
          SHIP_KEYSTORE_PATH: ${{ runner.temp }}/upload.p12
          SHIP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SHIP_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          SHIP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:bundleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/putt-drop.aab"

      - name: Verify release AAB signature
        run: |
          jarsigner -verify "$RUNNER_TEMP/putt-drop.aab" >/dev/null
          keytool -printcert -jarfile "$RUNNER_TEMP/putt-drop.aab" | awk '/SHA256:/{print; exit}'

      - name: Check merged manifest permissions in release AAB
        # Prints every uses-permission of the MERGED manifest inside the signed AAB and fails
        # unless it equals android/merged-permissions.expected.txt (reasons in docs/billing.md).
        env:
          BUNDLETOOL_VERSION: "1.17.2"
          BUNDLETOOL_SHA256: "2d4ad908faea64047c1cc9cb747e6aa667c6ab192e09607bd16b67246a8cd6ae"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$RUNNER_TEMP/putt-drop.aab" > "$RUNNER_TEMP/merged-manifest.xml"
          grep -oE '<uses-permission(-sdk-23)?[^>]*android:name="[^"]+"' "$RUNNER_TEMP/merged-manifest.xml" \
            | sed -E 's/.*android:name="([^"]+)".*/\1/' | sort -u > "$RUNNER_TEMP/merged-permissions.txt"
          echo "Merged manifest permissions:"
          cat "$RUNNER_TEMP/merged-permissions.txt"
          sort -u android/merged-permissions.expected.txt | diff -u - "$RUNNER_TEMP/merged-permissions.txt"

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.0
        with:
          name: putt-drop-aab
          path: ${{ runner.temp }}/putt-drop.aab
          if-no-files-found: error
          retention-days: 7
