# CI-able checks run on Ubuntu (keeps heavy test/solver runs off local Macs).
name: checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "levels/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/checks.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Level solver (36 holes)
        run: npm run check-levels
      - name: Typecheck + build + bundle guard
        run: npm run build
