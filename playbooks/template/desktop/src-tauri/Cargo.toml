[package]
name = "oasis-rig"
version = "0.1.0"
description = "OASIS Rig desktop shell"
authors = ["Cluer Holdings"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "oasis_rig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
