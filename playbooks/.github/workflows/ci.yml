name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: tests, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked

      - name: Tests
        run: uv run --no-sync pytest -q

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Types
        run: uv run --no-sync mypy --strict src

  pins:
    name: internal pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RDW-Labz/project-swarm
          ref: v1.25.0
          path: .swarm-tool
      - name: Check internal pins
        run: node .swarm-tool/tools/swarm.mjs --root . check-pins --core agent-core --app-prefix agent-
