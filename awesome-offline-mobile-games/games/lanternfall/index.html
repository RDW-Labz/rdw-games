<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="../../shell/assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#06080f">
<meta name="description" content="Lanternfall — a Newtonian space trading and combat sandbox. Fully offline.">
<title>Lanternfall</title>
<style>
  :root { --bg:#06080f; --cyan:#4de2ff; --ember:#ff7a45; }
  html, body {
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); overflow:hidden;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  #stage { position:fixed; inset:0; }
  canvas#game {
    display:block; width:100%; height:100%;
    background:#06080f; touch-action:none; outline:none;
  }
  /* GameKit thumb-pad, re-skinned to the Lanternfall palette. */
  .gk-pad .gk-btn {
    font:700 11px/64px ui-monospace, Menlo, Consolas, monospace !important;
    letter-spacing:.08em;
    background:rgba(77,226,255,.09) !important;
    border:1px solid rgba(77,226,255,.50) !important;
    color:#d8f6ff !important;
    box-shadow:0 0 16px rgba(77,226,255,.16), inset 0 0 14px rgba(77,226,255,.06);
  }
  .gk-pad .gk-btn.gk-btn-dash {
    background:rgba(255,122,69,.10) !important;
    border-color:rgba(255,122,69,.60) !important;
    color:#ffd9c7 !important;
    box-shadow:0 0 16px rgba(255,122,69,.18), inset 0 0 14px rgba(255,122,69,.07);
  }
  .gk-pad .gk-btn.gk-btn-use {
    background:rgba(255,255,255,.05) !important;
    border-color:rgba(159,196,214,.45) !important;
    color:#c9dfec !important;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="game" aria-label="Lanternfall"></canvas></div>
  <script src="../../vendor/vendor.js"></script>
  <script src="../../shell/lib/gamekit.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
