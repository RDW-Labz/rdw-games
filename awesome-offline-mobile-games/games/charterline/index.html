<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="../../shell/assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0e1116">
<meta name="description" content="Charterline — a turn-based hex 4X crossed with a commodity market: the full 74-tech Civ V tree, and chartered trade routes whose income comes from real price differences between your cities. Fully offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Charterline</title>
<style>
  :root { --bg:#0e1116; --accent:#f0b429; }
  html, body {
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); overflow:hidden; color:#e7ebf2;
    font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none; touch-action:none;
  }
  #wrap { position:fixed; inset:0; }
  #stage { position:absolute; inset:0; }
  canvas#c, canvas#game { display:block; width:100%; height:100%; touch-action:none; outline:none; }
  /* The game paints its entire HUD on the canvas; no DOM controls are needed.
     Any legacy button bar from an older shell stays out of the way. */
  #bar { display:none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c" aria-label="Charterline — hex 4X strategy game"></canvas></div>
</div>
<!-- Shared runtime and the vendored Civ V content tables live at the collection
     root, two levels up. vendor.js is optional: the game falls back to its
     authored eight-tech timeline if the bundle is missing. -->
<script src="../../vendor/vendor.js"></script>
<script src="../../shell/lib/gamekit.js"></script>
<script src="js/main.js"></script>
</body>
</html>
