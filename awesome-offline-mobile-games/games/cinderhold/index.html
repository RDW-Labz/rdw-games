<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="../../shell/assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b0709">
<meta name="description" content="Cinderhold — an isometric ARPG where every floor is a real Dungeon Crawl vault and every item is a Flare item. Fully offline.">
<title>Cinderhold</title>
<style>
  :root { --bg:#0b0709; --ember:#ff8a3d; --gold:#ffd479; --bone:#e8dcc8; }
  html, body {
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); overflow:hidden;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  #stage { position:fixed; inset:0; }
  canvas#game {
    display:block; width:100%; height:100%;
    background:#0b0709; touch-action:none; outline:none;
  }
  /* GameKit thumb-pad, re-skinned to Cinderhold's soot-and-ember palette. */
  .gk-pad .gk-btn {
    font:700 11px/64px ui-monospace, Menlo, Consolas, monospace !important;
    letter-spacing:.08em;
    background:rgba(255,138,61,.10) !important;
    border:1px solid rgba(255,138,61,.52) !important;
    color:#ffe3ce !important;
    box-shadow:0 0 16px rgba(255,138,61,.18), inset 0 0 14px rgba(255,138,61,.07);
  }
  .gk-pad .gk-btn.gk-btn-dash {
    background:rgba(255,212,121,.10) !important;
    border-color:rgba(255,212,121,.58) !important;
    color:#fff3cf !important;
  }
  .gk-pad .gk-btn.gk-btn-use {
    background:rgba(232,220,200,.06) !important;
    border-color:rgba(232,220,200,.38) !important;
    color:#e8dcc8 !important;
  }
</style>
</head>
<body>
  <div id="stage"><canvas id="game" aria-label="Cinderhold"></canvas></div>
  <script src="../../vendor/vendor.js"></script>
  <script src="../../shell/lib/gamekit.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
