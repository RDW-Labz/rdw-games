<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0a0b12" />
<link rel="icon" href="../../shell/assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0b12'/%3E%3Cpath d='M16 5l7 11-7 11-7-11z' fill='%237cf5d0'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="Rift Nine — nine procedurally-built rooms, one grapple hook, and a stopwatch that judges you. A momentum platformer that runs fully offline." />
<title>Rift Nine</title>
<style>
  :root { --bg:#0a0b12; --mint:#7cf5d0; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: #eaf6ff; overflow: hidden;
  }
  body {
    font: 400 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; }
  canvas#game {
    display: block; width: 100%; height: 100%;
    background: var(--bg); touch-action: none;
    outline: none;
  }
  /* The thumb pad still owns every pointer event; its chrome is painted on the
   * canvas (see drawControls) so the rings, gradients and pressed states can
   * share the game's palette and DPR-aware rendering. */
  .gk-pad { opacity: 0; }
  .gk-pad .gk-btn { backdrop-filter: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="540" aria-label="Rift Nine — momentum platformer. Drag the left side to run, tap the right side to jump, hold B to grapple."></canvas>
</div>
<script src="../../vendor/vendor.js"></script>
<script src="../../shell/lib/gamekit.js"></script>
<script src="js/main.js"></script>
</body>
</html>
