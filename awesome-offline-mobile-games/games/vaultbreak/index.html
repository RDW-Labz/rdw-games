<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="icon" href="../../shell/assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vaultbreak</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden;
    font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8eaf0;
    -webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  #stage{position:relative;flex:1;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #bar{display:flex;gap:8px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
    background:#12151c;border-top:1px solid #1e232e;justify-content:center;flex-wrap:wrap}
  /* Action bar: a control you can feel. Gradient + hairline + shadow reads as a physical
     button at arm's length; the press state has to move, because on a phone that IS the feedback. */
  .btn{flex:1 1 0;min-width:60px;max-width:150px;padding:12px 6px;border-radius:12px;text-align:center;
    background:linear-gradient(180deg,#222a38 0%,#141922 100%);
    border:1px solid rgba(255,255,255,.09);box-shadow:0 2px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);
    font:800 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;text-transform:uppercase;
    user-select:none;-webkit-user-select:none;color:#dfe4ee;transition:transform .06s,box-shadow .06s,filter .12s}
  .btn:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.55),inset 0 2px 6px rgba(0,0,0,.5);filter:brightness(1.18)}
  .btn.primary{background:linear-gradient(180deg,#3a2c12 0%,#20170a 100%);
    border-color:rgba(240,180,41,.5);color:#ffcf6b;box-shadow:0 2px 0 rgba(0,0,0,.55),inset 0 1px 0 rgba(255,213,128,.22)}
  .btn[disabled]{opacity:.3;filter:grayscale(.6)}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="bar">
    <div class="btn primary" id="bFire">FIRE</div>
    <div class="btn" id="bWait">WAIT</div>
    <div class="btn" id="bCraft">CRAFT</div>
    <div class="btn" id="bHelp">?</div>
  </div>
</div>
<script src="../../vendor/vendor.js"></script>
<script src="../../shell/lib/gamekit.js"></script>
<script src="js/main.js"></script>
</body>
</html>
