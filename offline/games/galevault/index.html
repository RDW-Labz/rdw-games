<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="../../shell/assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#070b10">
<meta name="description" content="Galevault — fly a glider down a gorge at speed, thread fourteen gates and outrun three pirates. Full 3D, fully offline.">
<title>Galevault</title>
<style>
  :root {
    --bg:#070b10; --deep:#0b141c; --teal:#38b9a6; --mint:#7bf0d0;
    --amber:#ffb64d; --bone:#eafcff; --grey:#9fb6c2; --red:#ef4444;
  }
  html, body {
    margin:0; padding:0; height:100%; width:100%; background:var(--bg);
    overflow:hidden; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
  }
  #stage { position:fixed; inset:0; }
  canvas#game, canvas#hud {
    position:absolute; top:0; left:0; display:block;
    width:100%; height:100%; touch-action:none; outline:none;
  }
  canvas#game { background:#070b10; }
  canvas#hud { pointer-events:none; }
  /* warm haze at the horizon, screened over the WebGL frame but under the HUD */
  #veil {
    position:fixed; inset:0; pointer-events:none; z-index:20;
    background:radial-gradient(120% 80% at 50% 30%, rgba(255,214,150,.10) 0%, rgba(56,185,166,0) 55%, rgba(4,10,14,.34) 100%);
    mix-blend-mode:screen; opacity:.5;
  }
  #boot {
    position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(80% 60% at 50% 42%, #12222b 0%, #070b10 72%);
    color:var(--bone); font:600 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing:.2em; text-transform:uppercase; transition:opacity .4s ease;
  }
  #boot.hide { opacity:0; pointer-events:none; }
  #boot .bar { width:190px; height:2px; background:rgba(234,252,255,.14); margin-top:14px; overflow:hidden; }
  #boot .bar i { display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--teal),var(--mint)); transition:width .2s ease; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" tabindex="0" aria-label="Galevault"></canvas>
  <canvas id="hud" aria-hidden="true"></canvas>
  <div id="veil"></div>
</div>
<div id="boot"><div>Galevault<div class="bar"><i id="bootbar"></i></div></div></div>
<script src="../../vendor/vendor.js"></script>
<script src="../../vendor/three/three.min.js"></script>
<script src="../../shell/lib/gamekit.js"></script>
<script src="js/world.js"></script>
<script src="js/scene3d.js"></script>
<script src="js/main.js"></script>
</body>
</html>
