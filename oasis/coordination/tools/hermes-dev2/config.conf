# Hermes workers on dev2: the knobs (decision #384). Installed to
# /etc/hermes-dev2/config.conf by setup-dev2.sh. KEY=VALUE, no shell syntax.
# Every tool reads these; nothing else names the model.

# The ONE model workers may use: exactly what dev2's 127.0.0.1:8000/v1/models
# lists (Braden, 2026-10-13). Change it here only.
MODEL=qwen3.8-flash-next-iq2_xs

# The prebuilt Hermes bundle (round 4): built off dev2 by the oasis repo's
# hermes-bundle CI workflow, never on dev2. Paste the sha256 the run prints;
# setup refuses to install without it, or on any mismatch.
BUNDLE_SHA256=60d82af5a21aa122133ea4718a6941844f69bdaeb6579c7d3df1bea4f29ba9ba
BUNDLE_ARCH=x86_64

# Concurrent jobs. Start at 2; raise only after the speed test (RUNBOOK).
MAX_WORKERS=2
# Off-hours window, America/Chicago, 24 h clock: jobs start only from
# WINDOW_START through the hour before WINDOW_END (22:00-05:59).
WINDOW_TZ=America/Chicago
WINDOW_START=22
WINDOW_END=6
# Stop rules (watchdog) and refusal floors (start wrapper and dispatch).
MIN_MEM_GB=8
MIN_DISK_GB=20
SPEED_FLOOR=0.5
# The proxy's Unix socket (hermes-proxy:hermes-sock 0660, peer-checked).
PROXY_SOCKET=/run/hermes-proxy/proxy.sock
# The proxy caps every chat call's max_tokens at this (and forces n=1).
MAX_TOKENS=8192
# Inside each job's private network namespace, the per-job forwarder
# listens here and relays to PROXY_SOCKET. Not reachable from dev2's host
# network at all.
JOB_PROXY_URL=http://127.0.0.1:8001/v1
JOB_PROXY_PORT=8001
# Size caps.
MAX_PROMPT_BYTES=2000000
MAX_OUTPUT_BYTES=8000000
# Finished replies the Mac never fetched are removed after this many minutes.
OUTBOX_TTL_MIN=60
