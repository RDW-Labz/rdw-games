# hermes-proxy settings (decision #384). Installed to /etc/hermes-dev2/proxy.conf.
# The model server the proxy forwards to (loopback only on dev2).
UPSTREAM_HOST=127.0.0.1
UPSTREAM_PORT=8000
# The uid that must own the model server's socket before the key is sent.
# setup-dev2.sh fills this in from the live listener (or --upstream-user).
UPSTREAM_UID=__SET_BY_SETUP__
