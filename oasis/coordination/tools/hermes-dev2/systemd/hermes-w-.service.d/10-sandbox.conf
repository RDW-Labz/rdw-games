# The worker sandbox (decision #384). A systemd prefix drop-in: it applies to
# every SERVICE whose name starts with "hermes-w-" (hermes-w-job@<id>.service
# and the pre-flight's hermes-w-probe@<name>.service), so the probe tests
# exactly the sandbox the jobs run in. Needs systemd >= 257 (setup refuses
# anything older: PrivatePIDs).
#
# Network: a PRIVATE network namespace (only "lo"), shared with the unit's
# own forwarder hermes-fwd@<id>.service, which is the one way out (to the
# proxy's Unix socket). Host listeners, the LAN, docker, tailscale, DNS,
# the internet and host abstract Unix sockets don't exist in here; host
# nftables rules don't apply inside it either, so PrivateNetwork and the
# IP filter below are this sandbox's walls. The worker can't create
# AF_UNIX or AF_INET6 sockets at all (socketpair still works).
[Service]
User=hermes-w
Group=hermes-w
UMask=0077
PrivateNetwork=yes
RestrictAddressFamilies=AF_INET
IPAddressDeny=any
IPAddressAllow=127.0.0.1
# Processes: each job is PID 1 of its own PID namespace with its own /proc,
# so one job can't see, signal or reach (/proc/<pid>/root, cwd, mem) another
# job, even though both run as hermes-w.
PrivatePIDs=yes
ProtectProc=invisible
# IPC: its own SysV IPC and POSIX message-queue namespace, and its own small
# /dev/shm (below), so no shared memory, semaphore or queue reaches another
# job or the host.
PrivateIPC=yes
# No privilege, ever.
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=yes
# Filesystem: read-only system. /run, /var/lib, /opt, /srv, /mnt, /media
# and /etc are replaced by empty root-owned tmpfs (no other job's folder,
# no service state or config, no host sockets); only Hermes, our scripts and
# the few /etc files a program needs are bound back, read-only. /tmp,
# /var/tmp and /dev/shm are this unit's own small tmpfs (no disk-backed PrivateTmp), and
# each unit binds its own one work folder (itself on a 2 GB tmpfs).
ProtectSystem=strict
ProtectHome=tmpfs
PrivateDevices=yes
TemporaryFileSystem=/run /var/lib /opt /srv /mnt /media /etc:size=4M,mode=0755 /tmp:size=256M,mode=1777 /var/tmp:size=64M,mode=1777 /dev/shm:size=16M,mode=1777
BindReadOnlyPaths=/opt/hermes-w/hermes-agent /opt/hermes-dev2/bin /etc/hermes-dev2
BindReadOnlyPaths=/etc/passwd /etc/group /etc/nsswitch.conf /etc/hosts /etc/ld.so.cache /etc/ld.so.conf
BindReadOnlyPaths=-/etc/ld.so.conf.d -/etc/localtime -/etc/ssl -/etc/ca-certificates -/etc/os-release -/etc/mime.types
InaccessiblePaths=-/etc/hermes-proxy -/root -/var/log -/var/www -/var/snap -/var/backups -/var/cache -/var/mail -/var/spool -/dev/mqueue
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
# Kernel surface.
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
SystemCallArchitectures=native
# @system-service already leaves out privileged calls; a stricter list risks
# killing Python on an ordinary setrlimit (systemd's default action is SIGSYS).
SystemCallFilter=@system-service
# Size: small, and never runaway.
MemoryMax=3G
MemorySwapMax=0
CPUQuota=200%
TasksMax=64
LimitCORE=0
RuntimeMaxSec=20min
TimeoutStopSec=15s
