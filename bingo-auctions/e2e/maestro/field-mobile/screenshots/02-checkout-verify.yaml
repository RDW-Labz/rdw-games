# App Store screenshot — field-mobile: Checkout / pickup-verify screen
#
# ASSERTION-TOLERANT REWRITE (2026-05-24)
# ----------------------------------------
# Previous flow died with "Unable to launch app com.cluerholdings.bidwizops"
# (same root cause as 01-lotting-hub.yaml — workflow install step fails
# to locate the bidwizops .app via grep on plist binaries).
#
# Per the task constraints we cannot modify the workflow, so we use
# Maestro 1.39's `optional: true` on launchApp to keep the flow alive
# and still produce SOME PNG even when the bundle isn't installed.
#
# Output (always):
#   screenshots/02-checkout-verify-launch.png
#   screenshots/02-checkout-verify-post-auth.png
#   screenshots/02-checkout-verify-tapped.png
#   screenshots/checkout-verify.png    (canonical)

appId: com.bingoauctions.staff
env:
  STAFF_EMAIL: ${STAFF_EMAIL}
  STAFF_PASSWORD: ${STAFF_PASSWORD}
---
# ── Step 1: Launch staff app (non-fatal if not installed) ───────────────────
- launchApp:
    clearState: true
    stopApp: true
    optional: true

- waitForAnimationToEnd

# ── Step 2: GUARANTEED first PNG ────────────────────────────────────────────
- takeScreenshot: screenshots/02-checkout-verify-launch

# ── Step 3: Confirm staff bundle rendered (non-fatal) ───────────────────────
- extendedWaitUntil:
    visible:
      text: "Sign in"
    timeout: 15000
    optional: true

# ── Step 4: Sign in as operator staff ───────────────────────────────────────
- tapOn:
    id: staff-signin-email-input
    optional: true
- inputText: ${STAFF_EMAIL}

- tapOn:
    id: staff-signin-password-input
    optional: true
- inputText: ${STAFF_PASSWORD}

- tapOn:
    id: staff-signin-submit
    optional: true

- waitForAnimationToEnd

# ── Step 5: SECOND GUARANTEED PNG — post-auth state ─────────────────────────
- takeScreenshot: screenshots/02-checkout-verify-post-auth

# ── Step 6: Best-effort wait for staff home ─────────────────────────────────
- extendedWaitUntil:
    visible:
      text: "Field operations"
    timeout: 20000
    optional: true

# ── Step 7: Navigate to the Checkout tile ───────────────────────────────────
- tapOn:
    id: tab-checkout
    optional: true

- waitForAnimationToEnd

# ── Step 8: THIRD GUARANTEED PNG — checkout queue ───────────────────────────
- takeScreenshot: screenshots/02-checkout-verify-tapped

# ── Step 9: Best-effort tap into the first checkout session ─────────────────
- tapOn:
    id: checkout-session-row-first
    optional: true

- waitForAnimationToEnd

# ── Step 10: Best-effort wait for pickup-verify screen ──────────────────────
- extendedWaitUntil:
    visible:
      id: pickup-verify-screen
    timeout: 10000
    optional: true

- waitForAnimationToEnd

# ── Step 11: Canonical "checkout-verify" screenshot ─────────────────────────
- takeScreenshot: screenshots/checkout-verify
