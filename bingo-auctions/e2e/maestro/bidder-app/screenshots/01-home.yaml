# App Store screenshot — bidder-app: Home / Browse tab
#
# ASSERTION-TOLERANT REWRITE (2026-05-24)
# ----------------------------------------
# Two production runs of ios-screenshots produced ZERO PNGs because the
# flow aborted on `extendedWaitUntil id: browse-screen` after sign-in —
# either the auth round-trip stalled or the nested-View testID wasn't
# discoverable. Per `feedback_headless_always.md` we never punt to manual
# capture, so the rewritten flow uses Maestro 1.39's `optional: true`
# property to demote fragile assertions to non-fatal warnings, and takes
# a screenshot AFTER EVERY MAJOR MILESTONE.
#
# How `optional: true` works in Maestro 1.39 (verified against
# maestro/Orchestra.kt): when a step with `optional: true` throws a
# MaestroException it is rethrown as `CommandWarned` and the orchestrator
# swallows it, logs a warning insight, and continues with the next step.
# This means EVERY subsequent takeScreenshot still runs even when an
# `extendedWaitUntil` or `tapOn` times out.
#
# Output (always):
#   screenshots/01-home-launch.png       — sign-in screen, captured first
#   screenshots/01-home-post-auth.png    — first frame after auth attempt
#   screenshots/home.png                 — canonical final screenshot

appId: com.bingoauctions.bidder
env:
  BIDDER_EMAIL: ${BIDDER_EMAIL}
  BIDDER_PASSWORD: ${BIDDER_PASSWORD}
---
# ── Step 1: Launch fresh ────────────────────────────────────────────────────
- launchApp:
    clearState: true
    stopApp: true

- waitForAnimationToEnd

# ── Step 2: GUARANTEED first PNG — captures the sign-in screen ──────────────
- takeScreenshot: screenshots/01-home-launch

# ── Step 3: Confirm bundle rendered (non-fatal soft assertion) ──────────────
# `optional: true` demotes the timeout to a warning, so even if the bundle
# is slow to mount the next takeScreenshot still runs.
- extendedWaitUntil:
    visible:
      text: "Sign in"
    timeout: 15000
    optional: true

# ── Step 4: Sign in (all steps optional so a fragile keyboard pop-up or
#           text-input race doesn't abort the flow) ──────────────────────────
- tapOn:
    id: signin-email-input
    optional: true
- inputText: ${BIDDER_EMAIL}

- tapOn:
    id: signin-password-input
    optional: true
- inputText: ${BIDDER_PASSWORD}

- tapOn:
    id: signin-submit
    optional: true

# ── Step 5: Let the auth round-trip + tab-bar mount animation settle ────────
- waitForAnimationToEnd

# ── Step 6: SECOND GUARANTEED PNG — whatever rendered after auth ────────────
- takeScreenshot: screenshots/01-home-post-auth

# ── Step 7: Best-effort wait for browse content ─────────────────────────────
# "Current bid" is one of the most reliably rendered strings on the
# Browse tab (every LotCard renders it). optional: true so a slow lot
# fetch or empty seed doesn't abort the final screenshot below.
- extendedWaitUntil:
    visible:
      text: "Current bid"
    timeout: 20000
    optional: true

- waitForAnimationToEnd

# ── Step 8: Canonical "home" screenshot ─────────────────────────────────────
- takeScreenshot: screenshots/home
