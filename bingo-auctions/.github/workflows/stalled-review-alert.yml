name: Stalled re-review alert

# #723: when a RED TEAM re-review request gets no verdict for 60+ minutes the
# PR used to stall silently. This sweep posts ONE read-only reminder per
# (PR, head) and never labels, approves, merges or counts as a verdict.
#
# Trusted-code only: scheduled/workflow_dispatch, checking out the default
# branch. No PR head code is ever executed, and a PR cannot trigger this job.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: stalled-review-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Flag stalled re-review requests
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/grok/stalled-review-alert.mjs
