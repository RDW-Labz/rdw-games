# Post-deploy check — run after every deploy (website, migration, OTA):
#   gh workflow run post-deploy-check.yml && gh run watch
# About a minute. Read-only against prod except a staff demo sign-in (signed
# out at the end). A FAIL means roll back first, investigate second.
# What it checks: scripts/post-deploy-check.mjs.
name: Post-deploy check

on:
  workflow_dispatch:
  push:
    branches: [braden/post-deploy-check]
    paths: ['.github/workflows/post-deploy-check.yml', 'scripts/post-deploy-check.mjs']

concurrency:
  group: post-deploy-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the checks
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAFF_EMAIL: demo-staff@bingoauctions.com
          STAFF_PASSWORD: ${{ secrets.ASC_STAFF_DEMO_PASSWORD }}
        run: |
          set -euo pipefail
          # The app's public URL and anon key are the bidder app's own (public) build env.
          export SUPABASE_URL=$(jq -r '.build.production.env.EXPO_PUBLIC_SUPABASE_URL' apps/bidder-app/eas.json)
          export SUPABASE_ANON_KEY=$(jq -r '.build.production.env.EXPO_PUBLIC_SUPABASE_ANON_KEY' apps/bidder-app/eas.json)
          node scripts/post-deploy-check.mjs
