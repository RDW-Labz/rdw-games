name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        # PERF-11 (2026-05-24 audit): --prefer-offline reuses the npm
        # cache that setup-node@v4 populated; --no-audit skips a slow
        # network call we don't gate CI on.
        run: npm ci --prefer-offline --no-audit
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          # PERF-13 (2026-05-24 audit): keying on github.sha invalidates
          # cache on every commit. hashFiles on package-lock.json only
          # busts when dependencies change.
          key: turbo-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: turbo-${{ runner.os }}-
      - name: Typecheck all workspaces
        run: npx turbo run typecheck
      - name: Preflight (launch-crash + dependency guards)
        # No workflow ran `npm run preflight`, so its rules rotted unnoticed:
        # two of them still enforced the 2026-05-20 expo-updates removal that
        # was reversed on 2026-05-25, and preflight had been failing on a clean
        # checkout for two months. A guard nobody runs is a guard that drifts
        # into blocking the thing it was meant to protect. ~2s.
        run: npm run preflight

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        # PERF-11 (2026-05-24 audit): --prefer-offline reuses the npm
        # cache that setup-node@v4 populated; --no-audit skips a slow
        # network call we don't gate CI on.
        run: npm ci --prefer-offline --no-audit
      - name: Lint all workspaces
        run: npx turbo run lint
      - name: Production credential and deployment boundary guards
        run: node --test .github/tests/ci-production-boundary.test.cjs
      - name: Source guards (block regressions of fixed bug patterns)
        # Static grep-style guards: no automatic_tax on charges (2026-06-02
        # outage), no { operatorId } to subscriptions/checkout (PR #204), no
        # reads of removed legacy columns (pro_*, operator_policies.shipping_offered).
        run: node scripts/smoke/source-guards.mjs
      - name: Cron schedule guard (every scheduled route has a handler, and back)
        # Four prod failures were a list naming something that was not there:
        # refund-jobs-drain (#321), settlements-release and reconcile-payments
        # (#330) all POSTed to a 404 on a timer, and social-post is a handler
        # nothing schedules. #330 ran this diff by hand and wrote the result in
        # a PR description; this keeps it. Also checks the cron expressions
        # against wrangler.jsonc, which nothing has ever compared.
        run: node scripts/smoke/cron-schedule-guard.mjs
      - name: Daily summary email tests (fake data only)
        run: node --test scripts/__tests__/daily-summary.test.mjs
      - name: Staff API route + dependency guard
        run: node --test scripts/__tests__/staff-api-routes.test.mjs
      - name: Needs-braden path labeler tests (#720)
        run: node --test scripts/__tests__/needs-braden-label.test.mjs
      - name: RED TEAM findings registry guard (#720)
        # Fails when the registry is malformed, an ID repeats, or a row marked
        # merged names a test file that is not in the checkout.
        run: |
          node --test scripts/__tests__/red-team-checklist.test.mjs
          node scripts/ci/red-team-checklist.mjs
      - name: Rollback-range verifier tests (#750)
        # A rollback range that starts after the implementation commit "works"
        # while leaving the change in place (#745 documented exactly that), so
        # the range is now replayed on a throwaway worktree and compared.
        run: node --test scripts/__tests__/rollback-range-0750.test.mjs
      - name: Business metrics snapshot tests (#725)
        # The published file must hold only numbers, the "<5" sentinel and one
        # date; a string (a name, an id, free text) anywhere fails the job
        # instead of reaching Grok.
        run: node --test scripts/__tests__/status-metrics.test.mjs
      - name: Stalled re-review alert tests (#723)
        # The sweep posts one reminder per (PR, head) after 60 minutes with no
        # RED TEAM verdict. These tests pin every binding case offline; the
        # scheduled workflow never runs PR code and never labels or merges.
        run: node --test scripts/__tests__/stalled-review-alert.test.mjs
      - name: Maestro failure watch tests (#868)
        # The watcher alerts once per master failure streak: text-only issue
        # comments, no labels/approvals/merges, no check weakening.
        run: node --test scripts/__tests__/maestro-failure-watch.test.mjs
      - name: Migration 0517 file-shape tests (#893 / #952)
        # Fails on the pre-fix rollback (reason-only refusal) and on a
        # flag-gated or missing append-only trigger. SQL behaviour is in
        # the schema-migrations job (bidder_credits_buckets.sql).
        run: node --test scripts/__tests__/migration-0517.test.mjs

  test:
    name: test
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        # PERF-11 (2026-05-24 audit): --prefer-offline reuses the npm
        # cache that setup-node@v4 populated; --no-audit skips a slow
        # network call we don't gate CI on.
        run: npm ci --prefer-offline --no-audit
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: turbo-test-${{ runner.os }}-
      - name: Run unit tests across workspaces
        run: npx turbo run test

  test-db:
    name: db package tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        # PERF-11 (2026-05-24 audit): --prefer-offline reuses the npm
        # cache that setup-node@v4 populated; --no-audit skips a slow
        # network call we don't gate CI on.
        run: npm ci --prefer-offline --no-audit
      - name: Run @auction-platform/db tests (smoke only; load test gated by PLACE_BID_LOAD=1)
        # PLACE_BID_LOAD is intentionally NOT set here. The smoke test
        # (place_bid load test module loads) runs without a Supabase stack.
        # To run the full load suite set PLACE_BID_LOAD=1 and provide
        # SUPABASE_URL + keys pointing at a local/staging Supabase instance.
        run: npm test --workspace=@auction-platform/db

  schema-check:
    name: schema migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector build of postgres 16: mig 0209 (product embeddings) runs
        # CREATE EXTENSION vector, which plain postgres:16-alpine can't satisfy
        # ("extension vector is not available" — the 2026-07-02 red-master run).
        # Supabase prod ships pgvector, so CI must too.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          # Supabase-only schemas + roles. We stub them so the migrations
          # apply cleanly in CI without a full Supabase stack. The roles
          # exist as NOLOGIN stubs — GRANT statements in our migrations
          # reference `authenticated` and `anon` (Supabase's RLS roles)
          # which would otherwise fail with "role does not exist" on
          # vanilla Postgres.
          psql -h localhost -U postgres -c "CREATE ROLE authenticated NOLOGIN;"
          psql -h localhost -U postgres -c "CREATE ROLE anon NOLOGIN;"
          psql -h localhost -U postgres -c "CREATE ROLE service_role NOLOGIN BYPASSRLS;"
          psql -h localhost -U postgres -c "CREATE SCHEMA auth; CREATE SCHEMA storage;"
          psql -h localhost -U postgres -c "CREATE TABLE auth.users (id uuid primary key);"
          # storage.buckets — superset of every column our migrations
          # touch. Supabase's real table has these plus a couple more
          # (cors_rules, lifecycle_rules) but we don't reference those.
          psql -h localhost -U postgres -c "
            CREATE TABLE storage.buckets (
              id                  text PRIMARY KEY,
              name                text,
              owner               uuid,
              owner_id            text,
              public              boolean DEFAULT false,
              file_size_limit     bigint,
              allowed_mime_types  text[],
              avif_autodetection  boolean DEFAULT false,
              created_at          timestamptz DEFAULT now(),
              updated_at          timestamptz DEFAULT now()
            );"
          psql -h localhost -U postgres -c "
            CREATE TABLE storage.objects (
              id            uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              bucket_id     text REFERENCES storage.buckets(id),
              name          text,
              owner         uuid,
              owner_id      text,
              metadata      jsonb,
              path_tokens   text[],
              version       text,
              created_at    timestamptz DEFAULT now(),
              updated_at    timestamptz DEFAULT now(),
              last_accessed_at timestamptz DEFAULT now()
            );"
          psql -h localhost -U postgres -c "CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$\$ SELECT NULL::uuid \$\$;"
          psql -h localhost -U postgres -c "CREATE OR REPLACE FUNCTION storage.foldername(name text) RETURNS text[] LANGUAGE sql AS \$\$ SELECT string_to_array(name, '/') \$\$;"
          # Supabase ships a logical-replication publication called
          # supabase_realtime that powers their Realtime feature. Our
          # migration 0017 ALTERs it (`ADD TABLE ...`). Stub it empty
          # here so the ALTER finds something to extend.
          psql -h localhost -U postgres -c "CREATE PUBLICATION supabase_realtime;"
          # pg_cron is not compiled into postgres:16-alpine. Stub the cron schema
          # so any migration referencing cron.schedule / cron.job finds them.
          # Migration 0071 wraps CREATE EXTENSION pg_cron in a safe DO block;
          # these stubs ensure cron.schedule() calls in later migrations also work.
          psql -h localhost -U postgres -c "CREATE SCHEMA IF NOT EXISTS cron;"
          psql -h localhost -U postgres -c "CREATE TABLE IF NOT EXISTS cron.job (jobid bigserial PRIMARY KEY, schedule text, command text, nodename text, nodeport int, database text, username text, active boolean DEFAULT true, jobname text);"
          psql -h localhost -U postgres -c "CREATE TABLE IF NOT EXISTS cron.job_run_details (jobid bigint, runid bigserial PRIMARY KEY, job_pid int, database text, username text, command text, status text, return_message text, start_time timestamptz, end_time timestamptz);"
          # cron.schedule() stubs RECORD the job into cron.job (real pg_cron
          # does too) so packages/db/test/cron_functions_smoke.sql can invoke
          # each scheduled command and catch deferred-planning errors — the
          # mig-0182 class where a function applies but throws at first run.
          # unschedule() removes the row so dropped jobs aren't smoke-tested.
          # These run during migration apply, so they stay no-throw.
          psql -h localhost -U postgres -c "CREATE OR REPLACE FUNCTION cron.schedule(p_schedule text, p_command text) RETURNS bigint LANGUAGE sql AS \$\$ INSERT INTO cron.job(schedule, command) VALUES (p_schedule, p_command); SELECT 0::bigint \$\$;"
          psql -h localhost -U postgres -c "CREATE OR REPLACE FUNCTION cron.schedule(p_name text, p_schedule text, p_command text) RETURNS bigint LANGUAGE sql AS \$\$ INSERT INTO cron.job(jobname, schedule, command) VALUES (p_name, p_schedule, p_command); SELECT 0::bigint \$\$;"
          psql -h localhost -U postgres -c "CREATE OR REPLACE FUNCTION cron.unschedule(p_name text) RETURNS boolean LANGUAGE sql AS \$\$ DELETE FROM cron.job WHERE jobname = p_name; SELECT true \$\$;"
          psql -h localhost -U postgres -c "CREATE OR REPLACE FUNCTION cron.unschedule(p_jobid bigint) RETURNS boolean LANGUAGE sql AS \$\$ SELECT true \$\$;"
          # Supabase ships pgcrypto in the `extensions` schema; migrations 0091 +
          # 0093 call `extensions.digest(...)` to hash policy text. On vanilla
          # Postgres `CREATE EXTENSION pgcrypto` (in migration 0001) lands the
          # function in `public`, and the `extensions` schema doesn't exist at
          # all. Stub a schema + an md5-backed `digest()` so the qualified call
          # resolves. The hash bytes differ from production but no migration
          # enforces hash length or value, so CI just needs the call to apply.
          psql -h localhost -U postgres -c "CREATE SCHEMA IF NOT EXISTS extensions;"
          psql -h localhost -U postgres -c "CREATE OR REPLACE FUNCTION extensions.digest(data text, algorithm text) RETURNS bytea LANGUAGE sql AS \$\$ SELECT decode(md5(data), 'hex') \$\$;"
          for f in packages/db/migrations/*.sql; do
            echo "Applying $f"
            if [[ "$f" == packages/db/migrations/0476_scan_resolver_ignores_dead_sales.sql ]]; then
              # 0476's preflight demands prod's exact _find_lot_by_scan text;
              # master's differs in comments only. Keep the preflight intact;
              # the fixture refuses any non-comment difference.
              psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
                -v bingo_empty_ci_fixture=0476_prod_function -f scripts/ci/fixture-0476-prod-find-lot-by-scan.sql
            fi
            if [[ "$f" == packages/db/migrations/0366_softdelete_catalog_misfire_20260921.sql ]]; then
              # Run the unchanged one-off cleanup with a positive synthetic
              # capture in this empty CI database; preserve its prod assertion.
              test "${GITHUB_ACTIONS:-}" = true
              psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
                -v bingo_empty_ci_fixture=0366_schema_only -f scripts/ci/fixture-0366.sql
            else
              psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
            fi
          done
      - name: Run SQL RPC tests (resolve_category_ids_batch)
        env:
          PGPASSWORD: postgres
        run: |
          # Plain-psql assertion tests (no pgTAP extension required).
          # resolve_category_ids_batch is STABLE + SECURITY DEFINER with no
          # auth.uid() dependency so it runs fine as the postgres superuser.
          # bulk_import_lots is NOT tested here — see test file header for rationale.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/resolve_category_ids_batch.sql
      - name: Test the one-active-lot-per-item guard (mig 0294)
        env:
          PGPASSWORD: postgres
        run: |
          # Locks in BOTH directions of the 2026-07-28 duplicate incident, which
          # flipped twice because each fix was verified in only one direction:
          # separately-stickered boxes under one lineage root must list, while
          # relist twins and ancestor/descendant pairs must still be refused.
          # Self-contained fixtures inside a ROLLBACKed transaction.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/lineage_assign_guard.sql
      - name: Test the scan resolver against relist collisions (mig 0304)
        run: |
          # The relist identity carryover leaves the box's printed label as BOTH
          # the retired parent's lot_code and the raw half of the live child's
          # sticker_code — 855 lot pairs on prod. The old first-hit ladder
          # probed lot_code before sticker_code and so answered every one of
          # those scans with the tombstone (no auction, stale bin).
          # Two fixtures are the ones a refactor loses: the UNLINKED pair (188
          # of the 855 have no relisted_from_lot_id back-pointer, so a
          # lineage-only fix leaves them broken) and the hop-only pair (nothing
          # but a tombstone matches, so the forward walk is the only answer).
          # Also pins soft-delete exclusion, qr_token precedence, batch put-away
          # filing against the live child, and pickup-by-sticker-label.
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/scan_resolver_collision.sql
      - name: Test the indexed manifest tracking probe (mig 0386)
        run: |
          # 2026-10-05 floor outage: every Wayfair label was in the pool, but the
          # tracking probe's OR-of-LIKEs read the whole import_rows heap per
          # scan (6-23 s on prod) and the staff role's 8 s statement_timeout
          # turned that into "no manifest match". 0386 probes the exact value
          # through the unique index first and only then the 154 list rows via
          # a partial index. Pins: 12-digit and 34-digit FedEx scans, the list
          # fallback, exact-beats-list, lotted rows excluded, clean misses,
          # the partial index predicate, and <100 ms per call.
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/find_import_row_by_scan_fast.sql
      - name: Test the phantom relist-child retirement (mig 0306)
        run: |
          # Repeated relist clicks after a forfeit left duplicate in_inventory
          # rows showing a sold box as available stock. The risk is cancelling
          # something real: phantoms and the row holding the sale are siblings
          # off the same parent, so the predicate is all that separates them.
          # Every must-NOT-cancel shape is pinned — the auction holder, a row
          # with bids, and the last row standing (cancelling that one erases
          # the item from inventory) — plus the 0290 canceled_at stamp.
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/phantom_relist_child.sql
      - name: Test the relist-twin retirement (mig 0307)
        run: |
          # The tail of the 0306 class: clone pairs where nothing in the lineage
          # ever reached an auction, so 0306's anchor (a sibling holding the
          # sale) did not exist and one of the duplicates IS the item's only
          # record. Keep the oldest, cancel the newer.
          # The fixture that matters is duplicate_lot (0299): that feature makes
          # two identical in_inventory siblings for two REAL boxes on purpose,
          # and only the absent lineage and a differing intake_at separate them
          # from a clone pair. Also pins keep-the-oldest (nothing may erase an
          # item), sticker-bound and bid-carrying rows, and the audit that keeps
          # the unanchored tail visible.
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/duplicate_relist_twin.sql
      - name: Test that a collected item can never be resold (migs 0355/0356)
        run: |
          # 2026-09-14 incident: items handed over at the counter were forfeited
          # by the sweep and relisted; second buyers found empty shelves. Pins
          # the relist guard across the WHOLE lineage (stamp or customer tick on
          # any ancestor blocks, a put-away scan or a refund clears), the
          # late-pickup restore (stamping a line on an unsold lot puts it back
          # to won), completion stamping its lines, and an end-to-end replay of
          # a partial pickup through auto_mark_pickup_no_show.
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/collected_item_never_resold.sql
      - name: Test the handover-invariant monitor and reclaim guard (migs 0357/0358)
        run: |
          # Second layer for the 2026-09-14 incident. Each detector case breaks
          # the guard that normally prevents the state (trigger disabled inside
          # the rolled-back transaction) and confirms the pg_cron monitor
          # reports it, then confirms the real remediation resolves the row.
          # Also pins: the 0358 trigger refuses a collected lot returning to
          # stock, an unguarded sweep tick rolls back whole, and returns /
          # put-away scans never trip either layer.
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/collected_item_invariant_monitor.sql
      - name: Test the untracked-manifest dedupe (mig 0310)
        run: |
          # The daily import-d2l-folder run re-inserted every untracked box on
          # every schedule tick: import_rows_tracking_uniq is UNIQUE (operator,
          # tracking_number) and NULLs are distinct in a plain btree, so the
          # importer's ON CONFLICT never fired for a box with no tracking
          # number. 18,297 prod rows stood in for 923 real units, +812/day.
          # The KEY is the risk, not the delete. 0309 keyed on how many rows
          # arrived in a day and would have destroyed 123 real units while
          # keeping 1,207 phantoms; 0310 keys on unit identity. So the fixtures
          # that matter are the ones that must NOT collapse — two unit_ids
          # under one order+sku, and a legacy line with ReturnedQuantity 2 —
          # pinned alongside the UPC fan-out that must, the closed NULL hole,
          # and the tracked population that was never broken.
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/import_rows_source_key_dedupe.sql
      - name: Test every app ON CONFLICT target is resolvable (contract)
        run: |
          # The seam that bit us three times in one week: a unit test proves the
          # code builds the right query STRING; nothing proved the database would
          # accept the query PostgREST DERIVES from it. On 2026-09-19 a manifest
          # import 500'd because commitImport upserts on (operator_id, source_key)
          # via PostgREST — a predicate-less ON CONFLICT — against a PARTIAL index
          # that only a WHERE-bearing raw statement could infer. The old SQL test
          # even wrote the predicate form, so it validated a query the app cannot
          # send. This test enumerates every onConflict target in the app and
          # asserts each is inferable by a predicate-less ON CONFLICT, i.e. backed
          # by a FULL unique index on exactly those columns. Keep its target list
          # in sync with `grep -rn onConflict: apps/operator-web/src`.
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/onconflict_targets_resolvable.sql
      - name: Test the carrier-barcode sticker guard (mig 0308)
        run: |
          # Wayfair returns arrive on FedEx labels, and the label's barcode wins
          # the camera frame over the colour sticker — three lots on 2026-08-02
          # bound the tracking number as their sticker_code, which is what the
          # worklist then displays. The old guard only caught numerics with a
          # valid GS1 check digit; FedEx tracking uses mod-11 and sailed through.
          # This is a SHAPE rule, so the ACCEPT cases carry the risk, not the
          # rejects: every real sticker family on prod (PNK/BRN/TEA colour
          # labels, LPNs, vendor SKUs, ASINs) is pinned as still bindable. A
          # tightening that flags 'SZQW-US-VD035-WE-A-M05' stops lotting cold.
          # Also pins the manual-entry override, rebind carrying the same guard,
          # 0283's twin guard surviving the rewrite, and repairable=false once a
          # lot has been filed into a bin.
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/carrier_barcode_sticker.sql
      - name: Test the relist location repair (mig 0305)
        run: |
          # relist copies intake_bin_id onto the child, then a put-away scan
          # that resolved to the retired ancestor (the mig 0304 bug) wrote the
          # real location there instead. 102 lots on prod; two customers were
          # sent to an empty shelf on 2026-07-31.
          # The DIRECTION is the risk: copying the wrong side sends staff to a
          # shelf the item was never on. Both fixtures that must NOT move are
          # pinned — a child re-binned more recently than its ancestor, and a
          # child whose ancestor is not a relisted tombstone. Plus idempotency.
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/relist_location_drift.sql
      - name: Test PIN-worker attribution on both create paths (mig 0321)
        run: |
          # 0321 adds an OVERLOAD to create_draft_lot and relist_lot_into_auction
          # rather than rewriting either (their bodies are 7KB and ~300 lines of
          # hot-path lotting/lineage logic). The risk that buys is overload
          # MIS-RESOLUTION, which would either break lotting on the warehouse
          # floor or silently keep attributing nothing — so both the old and the
          # new arity are pinned for each function.
          # Also pins that a foreign-operator or inactive worker id is dropped to
          # NULL rather than raising: attribution must never block a lot create.
          # Prod before this: relists 0% attributed (48% of volume), fresh lots
          # 61.8% via a fire-and-forget client UPDATE that swallowed failures.
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/lot_worker_attribution.sql
      - name: New lots carry their load (mig 0428)
        env:
          PGPASSWORD: postgres
        run: |
          # create_draft_lot/24 stamps the shift's load (same operator, not
          # archived; never blocks a lot); /22 and /23 unchanged; a relist
          # child inherits its parent's load; a manifest lot takes its import's
          # load and that beats the shift pick; nothing overwrites a load.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/lots_carry_load.sql
      - name: Load summary numbers (mig 0429)
        env:
          PGPASSWORD: postgres
        run: |
          # load_summary(load): lots / sold / unsold / gross / refunds / net
          # (tax excluded) / profit, relist copies counted through their
          # original lot, checked against hand-worked numbers; admin/manager
          # of the load's operator only; PUBLIC has no EXECUTE.
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -f packages/db/test/load_summary.sql
      - name: anon cannot call the load functions (mig 0430)
        env:
          PGPASSWORD: postgres
        run: |
