# PostgREST embed smoke — the app's read-path select strings, executed
# against a REAL PostgREST on the fully-migrated schema.
#
# Why: the 2026-08-09 'Pickup not found' outage shipped an embed hint that
# type-checks fine and only fails against a live PostgREST (constraint-name
# hint on a self-referencing FK → PGRST200). The typechecker sees a string,
# the SQL suite sees SQL, Playwright never signs in to a pickup — this is the
# only layer that exercises the select strings themselves.
#
# The query manifest lives in packages/db/test/postgrest_embed_smoke.mjs —
# keep it in sync when app read paths change.

name: PostgREST embed smoke

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: postgrest-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embed-smoke:
    name: embed smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector build — mig 0209 runs CREATE EXTENSION vector (same image
        # as ci.yml's schema-migrations job).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply migrations to scratch database
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/ci/apply-migrations-scratch.sh

      - name: Start PostgREST
        run: |
          set -euo pipefail
          # Pinned release. Asset naming per postgrest's release.yaml:
          # postgrest-${TAG}-linux-static-x86-64.tar.xz (x86-64, not x64 —
          # the v12-era name; the first run of this workflow tripped on that).
          VER=v14.16
          curl -sSL -o pgrst.tar.xz \
            "https://github.com/PostgREST/postgrest/releases/download/${VER}/postgrest-${VER}-linux-static-x86-64.tar.xz"
          # A 404 saves an HTML page; fail readably instead of inside tar.
          file pgrst.tar.xz | grep -q 'XZ compressed' || {
            echo '::error::postgrest download is not an xz archive — asset name or version is wrong'
            head -c 300 pgrst.tar.xz; exit 1; }
          tar xf pgrst.tar.xz
          PGRST_DB_URI="postgres://postgres:postgres@localhost:5432/postgres" \
          PGRST_DB_ANON_ROLE=anon \
          PGRST_DB_SCHEMAS=public \
          PGRST_SERVER_PORT=3333 \
          ./postgrest &
          # Wait for the schema cache to load — root answers once it's up.
          for i in $(seq 1 30); do
            curl -sf http://localhost:3333/ >/dev/null && exit 0
            sleep 1
          done
          echo '::error::PostgREST did not become ready'
          exit 1

      - name: Replay app read-path queries
        run: node packages/db/test/postgrest_embed_smoke.mjs http://localhost:3333
